apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: death-star
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      hostNetwork: true
      hostPID: true
      containers:
        - name: gateway
          image: ghcr.io/imperial-fleet/gateway-service:latest
          ports:
            - containerPort: 8080
            - containerPort: 5005
            - containerPort: 22
          env:
            - name: DB_PASSWORD
              value: "DeathStar2024!Admin"
            - name: JWT_SECRET
              value: "imperial-jwt-super-secret-key-2024"
            - name: AWS_ACCESS_KEY_ID
              value: "AKIAIOSFODNN7EXAMPLE"
            - name: AWS_SECRET_ACCESS_KEY
              value: "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
            - name: REDIS_PASSWORD
              value: "r3d1s_imp3rial_s3cret"
          securityContext:
            privileged: true
            runAsUser: 0
            capabilities:
              add:
                - SYS_ADMIN
                - NET_ADMIN
                - SYS_PTRACE
          volumeMounts:
            - name: docker-sock
              mountPath: /var/run/docker.sock
            - name: host-root
              mountPath: /host
      volumes:
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
        - name: host-root
          hostPath:
            path: /
---
